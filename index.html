<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео сайт</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

video {
    width: 90%;
    max-width: 900px;
    border-radius: 12px;
    display: none;
    margin-top: 15px;
}

.list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
}

.item {
    width: 90%;
    max-width: 600px;
    padding: 12px;
    border-radius: 10px;
    background: #1c1c1c;
    cursor: pointer;
    transition: 0.2s;
}

.item:hover {
    background: #333;
}

.active {
    background: #6c5ce7;
}
</style>
</head>

<body>

<h1>Видео</h1>

<video id="video" controls>
    <source id="source" src="" type="video/mp4">
</video>

<div class="list" id="list"></div>

<script>
const video = document.getElementById("video");
const source = document.getElementById("source");
const list = document.getElementById("list");

// 📦 видео
const videos = [
    { file: "video1.mp4", title: "СПАСИБО ДАША" },
    { file: "video2.mp4", title: "ПРАЙМ" },
    { file: "video3.mp4", title: "КЛЯНИСЬ" },
    { file: "video4.mp4", title: "АХАХХА ДАША Я НЕ МОГ НЕ ВСТАВИТЬ СОРИ МЕНЯ ПОРВАЛО" },
    { file: "video5.mp4", title: "СПОКОЙНО!!!" },
    { file: "video6.mp4", title: "ХИВХИХВИХ" },
    { file: "video7.mp4", title: "НУ ПРАВДА ЧТО ЭТО" },
    { file: "video8.mp4", title: "СТЕПАШКА" },
    { file: "video9.mp4", title: "КОНСПИРАЦИЯ" },
    { file: "video10.mp4", title: "А ХЗ))))" },
    { file: "video11.mp4", title: "ХАЗВЫХЗА" },
    { file: "video12.mp4", title: "ПРОГНОЗ НА 40 БАЛЛОВ ПО ПРОФМАТУ" }
];

let activeIndex = null;

// ▶ загрузка видео
function loadVideo(i) {
    video.style.display = "block";
    source.src = videos[i].file;
    video.load();
    video.play();

    activeIndex = i;
    renderList();
}

// 📋 список
function renderList() {
    list.innerHTML = "";

    videos.forEach((v, i) => {
        const div = document.createElement("div");
        div.className = "item" + (i === activeIndex ? " active" : "");
        div.innerText = v.title;
        div.onclick = () => loadVideo(i);
        list.appendChild(div);
    });
}

renderList();
</script>

</body>
</html>
