<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видео</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #0a0a0a, #1a0033);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            margin: 20px 0 30px;
            font-size: 2.2rem;
            background: linear-gradient(to right, #c445ff, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        video {
            width: 100%;
            max-width: 1000px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <h1 id="title">Загрузка...</h1>
    <video id="player" controls autoplay></video>

<script>
const urlParams = new URLSearchParams(window.location.search);
const videoNum = urlParams.get('v');

const videos = {
    "1": { title: "СПАСИБО ДАША", file: "video1.mp4" },
    "2": { title: "ПРАЙМ", file: "video2.mp4" },
    "3": { title: "КЛЯНИСЬ", file: "video3.mp4" },
    "4": { title: "АХАХХА ДАША Я НЕ МОГ НЕ ВСТАВИТЬ", file: "video4.mp4" },
    "5": { title: "СПОКОЙНО!!!", file: "video5.mp4" },
    "6": { title: "ХИВХИХВИХ", file: "video6.MOV" },
    "7": { title: "НУ ПРАВДА ЧТО ЭТО", file: "video7.mp4" },
    "8": { title: "СТЕПАШКА", file: "video8.mp4" },
    "9": { title: "КОНСПИРАЦИЯ", file: "video9.mp4" },
    "10": { title: "А ХЗ))))", file: "video10.mp4" },
    "11": { title: "ХАЗВЫХЗА", file: "video11.mp4" },
    "12": { title: "ПРОГНОЗ НА 40 БАЛЛОВ ПО ПРОФМАТУ", file: "video12.mp4" }
};

const video = videos[videoNum];

if (video) {
    document.getElementById('title').textContent = video.title;
    const player = document.getElementById('player');
    player.src = video.file;
} else {
    document.getElementById('title').textContent = "Видео не найдено";
}
</script>
</body>
</html>
