<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

h1 {
    margin-top: 30px;
    font-size: 24px;
}

.container {
    margin-top: 30px;
    padding: 0 15px;
}

video {
    display: none;
    width: 100%;
    max-width: 800px;
    border-radius: 12px;
}

button {
    padding: 14px 26px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #6c5ce7;
    color: white;
}

</style>
</head>
<body>

<canvas id="bg"></canvas>

<h1>Моё видео</h1>

<div class="container">
    <button onclick="startVideo()">▶ Смотреть</button>
    <br><br>

    <video id="video" controls>
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<script>
const video = document.getElementById("video");
const progress = document.getElementById("progress");

// 👉 берём параметр из ссылки
const params = new URLSearchParams(window.location.search);
const videoSrc = params.get("v");

// если есть параметр — используем его
if (videoSrc) {
    video.src = videoSrc;
} else {
    video.src = "video.mp4"; // запасной вариант
}

// запуск
function startVideo() {
    document.querySelector(".start-btn").style.display = "none";
    document.getElementById("player").style.display = "block";
    video.play();
}

// play/pause
function togglePlay() {
    if (video.paused) video.play();
    else video.pause();
}

// mute
function toggleMute() {
    video.muted = !video.muted;
}

// прогресс
video.addEventListener("timeupdate", () => {
    progress.value = (video.currentTime / video.duration) * 100;
});

progress.addEventListener("input", () => {
    video.currentTime = (progress.value / 100) * video.duration;
});
</script>

</body>
</html>
