<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

h1 {
    margin-top: 30px;
    font-size: 24px;
}

.container {
    margin-top: 30px;
    padding: 0 15px;
}

video {
    display: none;
    width: 100%;
    max-width: 800px;
    border-radius: 12px;
}

button {
    padding: 14px 26px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #6c5ce7;
    color: white;
}

</style>
</head>
<body>

<canvas id="bg"></canvas>

<h1>Моё видео</h1>

<div class="container">
    <button onclick="startVideo()">▶ Смотреть</button>
    <br><br>

    <video id="video" controls>
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<script>
function startVideo() {
    const video = document.getElementById("video");
    video.style.display = "block";
    video.play();
    document.querySelector("button").style.display = "none";
}

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

for (let i = 0; i < 80; i++) {
    particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2,
        dx: (Math.random() - 0.5) * 0.5,
        dy: (Math.random() - 0.5) * 0.5
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "white";

    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
    });

    requestAnimationFrame(draw);
}

draw();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
