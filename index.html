<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    margin-top: 30px;
    padding: 0 15px;
}

video {
    display: none;
    width: 100%;
    max-width: 800px;
    border-radius: 12px;
}

button {
    padding: 14px 26px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: #6c5ce7;
    color: white;
    cursor: pointer;
    margin-bottom: 15px;
}

#text {
    margin-top: 15px;
    font-size: 18px;
    opacity: 0.9;
}
</style>
</head>

<body>

<h1>Моё видео</h1>

<div class="container">

    <button onclick="startVideo()">▶ Смотреть</button>

    <video id="video" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <div id="text"></div>

</div>

<script>
const video = document.getElementById("video");
const textBlock = document.getElementById("text");

// параметры из ссылки
const params = new URLSearchParams(window.location.search);
const videoSrc = params.get("v");
const text = params.get("text");

// установка видео
if (videoSrc) {
    video.src = videoSrc;
}

// установка текста под видео
if (text) {
    textBlock.innerText = text;
} else {
    textBlock.innerText = "Описание видео отсутствует";
}

// кнопка старт
function startVideo() {
    video.style.display = "block";
    video.play();
}
</script>

</body>
</html>
