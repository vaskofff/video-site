<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

video {
    width: 90%;
    max-width: 900px;
    border-radius: 12px;
    display: none;
    margin-top: 15px;
}

.buttons {
    margin-top: 20px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 0 10px;
}

button {
    padding: 10px 14px;
    border: none;
    border-radius: 8px;
    background: #6c5ce7;
    color: white;
    cursor: pointer;
    font-size: 14px;
}
</style>
</head>

<body>

<h1>Видео</h1>

<video id="video" controls>
    <source id="source" src="" type="video/mp4">
</video>

<div class="buttons" id="buttons"></div>

<script>
const video = document.getElementById("video");
const source = document.getElementById("source");
const buttons = document.getElementById("buttons");

// 📦 список видео
const videos = [
    { file: "video1.mp4", title: "СПАСИБО ДАША" },
    { file: "video2.mp4", title: "ПРАЙМ" },
    { file: "video3.mp4", title: "КЛЯНИСЬ" },
    { file: "video4.mp4", title: "АХАХХА ДАША Я НЕ МОГ НЕ ВСТАВИТЬ СОРИ МЕНЯ ПОРВАЛО" },
    { file: "video5.mp4", title: "СПОКОЙНО!!!" },
    { file: "video6.mp4", title: "ХИВХИХВИХ" },
    { file: "video7.mp4", title: "НУ ПРАВДА ЧТО ЭТО" },
    { file: "video8.mp4", title: "СТЕПАШКА" },
    { file: "video9.mp4", title: "КОНСПИРАЦИЯ" },
    { file: "video10.mp4", title: "А ХЗ))))" },
    { file: "video11.mp4", title: "ХАЗВЫХЗА" },
    { file: "video12.mp4", title: "ПРОГНОЗ НА 40 БАЛЛОВ ПО ПРОФМАТУ" }
];

// ▶ загрузка видео
function loadVideo(index) {
    video.style.display = "block";
    source.src = videos[index].file;
    video.load();
    video.play();
}

// 🔘 создаём кнопки автоматически
videos.forEach((v, i) => {
    const btn = document.createElement("button");
    btn.innerText = v.title;
    btn.onclick = () => loadVideo(i);
    buttons.appendChild(btn);
});
</script>

</body>
</html>
