<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Видео</title>

<style>
body {
    background: #0a0a0a;
    color: white;
    font-family: Arial;
    text-align: center;
}

#list {
    margin-top: 20px;
}

.item {
    background: #1c1c1c;
    margin: 10px auto;
    padding: 12px;
    width: 80%;
    cursor: pointer;
}

.item:hover {
    background: #333;
}
</style>
</head>

<body>

<h1>Видео список</h1>

<video id="video" width="80%" controls style="display:none"></video>

<div id="list"></div>

<script>
const video = document.getElementById("video");
const list = document.getElementById("list");

const videos = [
    { file: "video1.mp4", title: "СПАСИБО ДАША" },
    { file: "video2.mp4", title: "ПРАЙМ" },
    { file: "video3.mp4", title: "КЛЯНИСЬ" }
];

videos.forEach(v => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerText = v.title;

    div.onclick = () => {
        video.style.display = "block";
        video.src = v.file;
        video.play();
    };

    list.appendChild(div);
});
</script>

</body>
</html>
